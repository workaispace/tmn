<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Investment Heatmap</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            
            /* Цвета тепловой карты (более мягкие) */
            --red-cell: #fce8e6;
            --red-text: #c5221f;
            --yellow-cell: #fef7e0;
            --yellow-text: #ea8600;
            --green-cell: #e6f4ea;
            --green-text: #137333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-weight: 500;
            font-size: 28px;
            color: var(--primary-color);
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(60,64,67, 0.3), 0 4px 8px rgba(60,64,67, 0.15);
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        /* Grid Layout */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input {
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        input[readonly] {
            background-color: #f8f9fa;
            border-style: dashed;
            color: var(--text-secondary);
        }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
            font-variant-numeric: tabular-nums;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #edf0f2;
            font-size: 14px;
        }

        /* Header Cells */
        thead th {
            background-color: #f8f9fa;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        .header-main {
            background-color: var(--primary-color) !important;
            color: white !important;
        }

        /* Sticky Columns */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: #f8f9fa;
            font-weight: 600;
            border-right: 2px solid var(--border-color);
        }

        thead tr:first-child th.sticky-col {
            z-index: 11;
        }

        /* Heatmap Classes */
        .cell-red { background-color: var(--red-cell); color: var(--red-text); font-weight: 500; }
        .cell-yellow { background-color: var(--yellow-cell); color: var(--yellow-text); font-weight: 500; }
        .cell-green { background-color: var(--green-cell); color: var(--green-text); font-weight: 500; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 16px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Инвестиционный калькулятор</h1>
    </header>

    <div class="card">
        <div class="section-title">Параметры портфеля</div>
        <div class="grid-inputs">
            <div class="input-group">
                <label>Общая сумма инвестирования</label>
                <input type="text" id="sumTotal" value="10 000 000" oninput="onSumInput(event)">
            </div>
            <div class="input-group">
                <label>Консервативная часть (%)</label>
                <input type="number" id="consShare" value="70" min="0" max="100" oninput="updateAggressiveShare()">
            </div>
            <div class="input-group">
                <label>Агрессивная часть (%)</label>
                <input type="number" id="aggShare" value="30" readonly>
            </div>
            <div class="input-group">
                <label>Сумма консервативной части</label>
                <input type="text" id="consAmount" readonly>
            </div>
            <div class="input-group">
                <label>Сумма агрессивной части</label>
                <input type="text" id="aggAmount" readonly>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Настройка горизонтов доходности</div>
        <div class="grid-inputs">
            <div class="input-group">
                <label>Консервативная: От (%)</label>
                <input type="number" id="yieldStart" value="20" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Консервативная: До (%)</label>
                <input type="number" id="yieldEnd" value="12" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Шаг доходности (%)</label>
                <input type="number" id="yieldStep" value="1" step="0.1" oninput="calculate()">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Тепловая карта доходности</div>
        <div class="table-container">
            <table id="heatmap">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const aggressiveYields = [
        3.15, 2.75, 2.38, 2.02, 1.70, 1.37, 1.00, 0.80, 
        0.50, 0.25, 0.05, 0.00, -0.20, -0.40, -0.60, -0.80, -1.00
    ];

    function formatNumberStr(str) {
        let parts = str.toString().split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return parts.join('.');
    }

    function onSumInput(e) {
        let input = e.target;
        let cursorPosition = input.selectionStart;
        let oldLength = input.value.length;
        let val = input.value.replace(/[^\d.]/g, '');
        let parts = val.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        let newVal = parts.join('.');
        input.value = newVal;
        let newLength = newVal.length;
        cursorPosition += (newLength - oldLength);
        input.setSelectionRange(cursorPosition, cursorPosition);
        calculate();
    }

    function updateAggressiveShare() {
        let b4 = parseFloat(document.getElementById('consShare').value) || 0;
        if (b4 > 100) b4 = 100;
        if (b4 < 0) b4 = 0;
        document.getElementById('consShare').value = b4;
        document.getElementById('aggShare').value = 100 - b4;
        calculate();
    }

    function calculate() {
        let sumStr = document.getElementById('sumTotal').value.replace(/\s/g, '');
        const sumTotal = parseFloat(sumStr) || 0;
        const consSharePercent = parseFloat(document.getElementById('consShare').value) || 0;
        const aggSharePercent = 100 - consSharePercent;

        document.getElementById('consAmount').value = formatNumberStr(((sumTotal * consSharePercent) / 100).toFixed(2));
        document.getElementById('aggAmount').value = formatNumberStr(((sumTotal * aggSharePercent) / 100).toFixed(2));

        let start = parseFloat(document.getElementById('yieldStart').value) || 0;
        let end = parseFloat(document.getElementById('yieldEnd').value) || 0;
        let step = Math.abs(parseFloat(document.getElementById('yieldStep').value) || 1);

        const consYields = [];
        if (start >= end) {
            for (let i = start; i >= end; i -= step) consYields.push(i);
        } else {
            for (let i = start; i <= end; i += step) consYields.push(i);
        }
        renderTable(consYields, consSharePercent / 100, aggSharePercent / 100);
    }

    function renderTable(consYields, consShare, aggShare) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        let headerRow1 = `<tr><th class="sticky-col header-main">АГРЕССИВНАЯ ЧАСТЬ</th><th colspan="${consYields.length}" class="header-main">КОНСЕРВАТИВНАЯ ЧАСТЬ</th></tr>`;
        let headerRow2 = '<tr><th class="sticky-col">Доходность</th>';
        consYields.forEach(val => { headerRow2 += `<th>${val}%</th>`; });
        headerRow2 += '</tr>';
        thead.innerHTML = headerRow1 + headerRow2;

        aggressiveYields.forEach(aggY => {
            let tr = document.createElement('tr');
            let th = document.createElement('td');
            th.className = 'sticky-col';
            th.textContent = (aggY * 100).toFixed(0) + '%';
            tr.appendChild(th);

            consYields.forEach(consY => {
                let td = document.createElement('td');
                let resultPercent = Math.round(((consShare * (consY/100) * 2) + (aggShare * aggY)) * 100);
                td.textContent = resultPercent + '%';
                if (resultPercent < 0) td.className = 'cell-red';
                else if (resultPercent <= 30) td.className = 'cell-yellow';
                else td.className = 'cell-green';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    window.onload = updateAggressiveShare;
</script>

</body>
</html>
